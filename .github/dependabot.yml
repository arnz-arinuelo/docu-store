version: 2
updates:
  - package-ecosystem: uv
    directory: /services
    schedule:
      interval: weekly
    groups:
      services-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors (docling, langchain, rdkit calver years, ...) are deliberate upgrades.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Frontend majors (Next, React, Tailwind, ...) are deliberate upgrades.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    groups:
      cli-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Action bumps are major-only (v4 -> v7), so group them all into one PR.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/services, /web]
    schedule:
      interval: weekly
    # Base image majors (python 3.x, node 2x) are deliberate upgrades.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
