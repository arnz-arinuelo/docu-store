version: 2
updates:
  - package-ecosystem: uv
    directory: /services
    schedule:
      interval: weekly
    groups:
      services-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Frontend majors (Next, React, Tailwind, ...) are deliberate upgrades.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    groups:
      cli-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/services, /web]
    schedule:
      interval: weekly
